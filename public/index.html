<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Workforce — Hire AI Employees</title>
<style>
  :root{
    --ink:#14181C;--panel:#1D2329;--panel2:#2A3138;--line:rgba(255,255,255,.1);--line-soft:rgba(255,255,255,.06);
    --fg:#EDEBE2;--fg-dim:#9BA3AA;--teal:#4FA98C;--teal-dim:rgba(79,169,140,.16);
    --amber:#D9A441;--amber-dim:rgba(217,164,65,.16);--rust:#C1554A;--rust-dim:rgba(193,85,74,.16);
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--serif:Georgia,'Times New Roman',serif;--mono:'SF Mono',Consolas,monospace;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--ink);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55}
  a{color:var(--teal)}
  #app{max-width:960px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  header.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink);z-index:10}
  .wordmark{font-weight:700;letter-spacing:.3px;cursor:pointer}
  nav.top a{color:var(--fg-dim);text-decoration:none;font-size:13px;margin-left:16px;cursor:pointer}
  main{flex:1;padding:22px 18px 60px}
  h1{font-size:26px;margin:.2em 0}
  h2{font-size:19px;margin:1.4em 0 .5em}
  p.lead{color:var(--fg-dim);font-size:15px;max-width:60ch}
  .btn{display:inline-block;background:var(--teal);color:#08211A;font-weight:600;padding:10px 16px;border-radius:8px;border:none;cursor:pointer;font-size:14px;text-decoration:none}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
  .btn.danger{background:transparent;color:var(--rust);border:1px solid var(--rust-dim)}
  .btn:disabled{opacity:.4;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
  .card:hover{border-color:var(--teal)}
  .card h3{margin:0 0 4px;font-size:16px}
  .card .role{color:var(--fg-dim);font-size:12.5px;font-family:var(--mono)}
  .card p{color:var(--fg-dim);font-size:13px;margin:10px 0 0}
  .badge{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 8px;border-radius:5px;margin-top:8px}
  .badge.live{background:var(--teal-dim);color:var(--teal)}
  .badge.soon{background:var(--panel2);color:var(--fg-dim)}
  .profile-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--fg-dim)}
  ul.plain{padding-left:18px;margin:8px 0}
  ul.plain li{margin:4px 0;font-size:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--fg-dim);margin-bottom:6px;font-family:var(--mono)}
  input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);font-size:14px;padding:10px;font-family:var(--font)}
  textarea{resize:vertical;min-height:90px}
  form{max-width:400px}
  .error{color:var(--rust);font-size:13px;margin:8px 0}
  .notice{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--fg-dim);margin:14px 0}
  .notice.warn{border-color:var(--amber-dim);color:var(--amber)}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
  .tabs button{background:none;border:none;color:var(--fg-dim);padding:9px 4px;margin-right:16px;cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.active{color:var(--fg);border-color:var(--teal)}
  .conv-row{display:flex;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .conv-row:hover{background:var(--panel2)}
  .chip{font-size:10.5px;font-family:var(--mono);padding:3px 8px;border-radius:5px;white-space:nowrap}
  .chip-open{background:var(--panel2);color:var(--fg-dim)}
  .chip-awaiting_review{background:var(--amber-dim);color:var(--amber)}
  .chip-answered{background:var(--teal-dim);color:var(--teal)}
  .chip-needs_owner{background:var(--rust-dim);color:var(--rust)}
  .msg-row{padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .msg-role{font-size:11px;font-family:var(--mono);color:var(--fg-dim);margin-bottom:3px}
  .msg-body{white-space:pre-wrap;font-size:14px}
  .draft-box{background:var(--panel2);border:1px solid var(--amber-dim);border-radius:8px;padding:12px;margin:10px 0}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .stat .num{font-size:22px;font-weight:700}
  .stat .lab{font-size:10.5px;color:var(--fg-dim);font-family:var(--mono);margin-top:2px}
  code.snip{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;overflow-x:auto;white-space:pre}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .doc-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .doc-item h4{margin:0 0 4px}
  .doc-item p{color:var(--fg-dim);font-size:13px;white-space:pre-wrap;margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = '/api';
let TOKEN = localStorage.getItem('supportai_token') || null;
let ME = null;
let view = TOKEN ? 'dashboard' : 'landing';
let params = {};
let err = '';

async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  const res = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.message || 'Request failed'), { data, status: res.status });
  return data;
}
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function go(v, p) { view = v; params = p || {}; err = ''; render(); window.scrollTo(0,0); }
function logout() { TOKEN=null; ME=null; localStorage.removeItem('supportai_token'); go('landing'); }

const PROFILES = {
  'customer-support': {
    name: 'Aria', role: 'Customer Support Specialist', live: true,
    blurb: 'Answers your customers\u2019 questions using only the information you give her — prices, hours, policies, FAQs. Anything she\u2019s not sure about, she hands to you instead of guessing.',
    skills: ['Reads your business info and cites what she used', 'Refuses to answer if your info doesn\u2019t cover it', 'Never invents prices, dates, links, or policies', 'Works on your website via a small chat widget'],
    access: ['The business information you add', 'The current conversation'],
    approval: 'Every reply is held for your approval before it reaches a customer, until you choose to turn that off for a role.',
  },
  'executive-assistant': {
    name: 'Sophia', role: 'Executive Assistant', live: false,
    blurb: 'Planned: email triage and drafting, scheduling, and simple research — with nothing sent without your approval.',
    skills: ['Draft email replies for you to send', 'Summarize and organize your inbox', 'Track follow-ups and tasks'],
  },
  'operations': {
    name: 'Marcus', role: 'Operations Specialist', live: false,
    blurb: 'Planned: monitoring orders and systems and producing daily reports, starting read-only before any write actions are added.',
    skills: ['Daily summaries of orders, payments, and issues', 'Flags problems for a person to check', 'Write actions (like updating a record) added later, behind approval limits'],
  },
};

function Landing() {
  return `
    <h1>Hire AI Employees.</h1>
    <p class="lead">Instead of buying another software tool, hire an AI employee who does the work — and a person always checks what goes out.</p>
    <div class="row" style="margin-top:16px">
      <button class="btn" onclick="go('browse')">Browse AI Employees</button>
      <button class="btn ghost" onclick="go('login')">Log in</button>
    </div>
    <div class="notice">This is an early product. Right now one role — Customer Support — is fully built and ready to use. The other two are shown so you can see where this is headed.</div>
  `;
}

function Browse() {
  const cards = Object.entries(PROFILES).map(([id, p]) => `
    <div class="card" onclick="go('profile', {id:'${id}'})">
      <h3>${esc(p.name)}</h3>
      <div class="role">${esc(p.role)}</div>
      <p>${esc(p.blurb)}</p>
      <span class="badge ${p.live ? 'live' : 'soon'}">${p.live ? 'Available now' : 'Coming soon'}</span>
    </div>`).join('');
  return `<h1>Browse AI Employees</h1><p class="lead">Three roles, one shared engine underneath. More roles are added the same way.</p><div class="grid">${cards}</div>`;
}

function Profile() {
  const p = PROFILES[params.id];
  if (!p) return `<p>Not found. <a onclick="go('browse')">Back to Browse</a></p>`;
  const skills = p.skills.map((s) => `<li>${esc(s)}</li>`).join('');
  return `
    <p><a onclick="go('browse')">&larr; Browse</a></p>
    <h1>${esc(p.name)}</h1>
    <div class="profile-box">
      <div class="kv"><span class="k">Role</span><span>${esc(p.role)}</span></div>
      <div class="kv"><span class="k">Status</span><span class="badge ${p.live?'live':'soon'}">${p.live?'Available now':'Coming soon'}</span></div>
      ${p.live ? '<div class="kv"><span class="k">Pricing</span><span>Free while you try it, then a plan we\u2019ll agree with you directly</span></div>' : ''}
      ${p.live ? '<div class="kv"><span class="k">Approval</span><span>' + esc(p.approval) + '</span></div>' : ''}
    </div>
    <h2>What ${esc(p.name)} does</h2>
    <p class="lead">${esc(p.blurb)}</p>
    <ul class="plain">${skills}</ul>
    ${p.access ? '<h2>What she can access</h2><ul class="plain">' + p.access.map((a) => `<li>${esc(a)}</li>`).join('') + '</ul>' : ''}
    <div style="margin-top:20px">
      ${p.live
        ? `<button class="btn" onclick="go('signup',{id:'${params.id}'})">Hire ${esc(p.name)}</button>`
        : `<button class="btn" disabled>Not hireable yet</button>`}
    </div>
    ${p.live ? '<div class="notice">No fake reviews here — this role is new, so you\u2019d be among the first businesses using it. Everything above is what the product actually does today.</div>' : ''}
  `;
}

function Signup() {
  return `
    <p><a onclick="go('profile',{id: params.id || 'customer-support'})">&larr; Back</a></p>
    <h1>Set up your account</h1>
    <p class="lead">This creates your business's account. Next you'll add your own information — that's what the AI answers from.</p>
    ${err ? `<div class="error">${esc(err)}</div>` : ''}
    <form onsubmit="return handleSignup(event)">
      <div class="field"><label>Business name</label><input id="su_name" required maxlength="100"></div>
      <div class="field"><label>Email</label><input id="su_email" type="email" required maxlength="254"></div>
      <div class="field"><label>Password (min 8 characters)</label><input id="su_pw" type="password" required minlength="8" maxlength="200"></div>
      <button class="btn" type="submit">Create account</button>
    </form>
    <p class="lead" style="margin-top:14px">Already have an account? <a onclick="go('login')">Log in</a></p>
  `;
}
async function handleSignup(e) {
  e.preventDefault();
  try {
    const businessName = document.getElementById('su_name').value.trim();
    const email = document.getElementById('su_email').value.trim();
    const password = document.getElementById('su_pw').value;
    const { token } = await api('POST', '/auth/signup', { businessName, email, password });
    TOKEN = token; localStorage.setItem('supportai_token', token);
    await go('onboarding');
  } catch (ex) { err = ex.message; render(); }
  return false;
}

function Login() {
  return `
    <h1>Log in</h1>
    ${err ? `<div class="error">${esc(err)}</div>` : ''}
    <form onsubmit="return handleLogin(event)">
      <div class="field"><label>Email</label><input id="li_email" type="email" required></div>
      <div class="field"><label>Password</label><input id="li_pw" type="password" required></div>
      <button class="btn" type="submit">Log in</button>
    </form>
  `;
}
async function handleLogin(e) {
  e.preventDefault();
  try {
    const email = document.getElementById('li_email').value.trim();
    const password = document.getElementById('li_pw').value;
    const { token } = await api('POST', '/auth/login', { email, password });
    TOKEN = token; localStorage.setItem('supportai_token', token);
    await go('dashboard');
  } catch (ex) { err = ex.message; render(); }
  return false;
}

async function Onboarding() {
  return `
    <h1>Add your first business information</h1>
    <p class="lead">Add anything a customer might ask about: prices, hours, shipping, refund policy, FAQs. Aria will only answer from what you add here.</p>
    ${err ? `<div class="error">${esc(err)}</div>` : ''}
    <form onsubmit="return handleAddDoc(event, true)">
      <div class="field"><label>Title</label><input id="ob_title" required maxlength="200" placeholder="e.g. Shipping & returns"></div>
      <div class="field"><label>Details</label><textarea id="ob_body" required maxlength="20000" placeholder="Write it the way you'd explain it to a new staff member."></textarea></div>
      <button class="btn" type="submit">Save and continue</button>
    </form>
  `;
}
async function handleAddDoc(e, thenDashboard) {
  e.preventDefault();
  try {
    const title = document.getElementById(thenDashboard ? 'ob_title' : 'nd_title').value.trim();
    const body = document.getElementById(thenDashboard ? 'ob_body' : 'nd_body').value.trim();
    await api('POST', '/knowledge', { title, body });
    if (thenDashboard) await go('dashboard', { tab: 'knowledge' });
    else await loadDashboard('knowledge');
  } catch (ex) { err = ex.message; render(); }
  return false;
}

let DASH = { conversations: [], docs: [], conv: null };

async function loadDashboard(tab) {
  ME = await api('GET', '/me');
  if (!tab) tab = params.tab || 'conversations';
  params = { tab };
  if (tab === 'conversations') DASH.conversations = (await api('GET', '/conversations')).conversations;
  if (tab === 'knowledge') DASH.docs = (await api('GET', '/knowledge')).documents;
  if (tab === 'reports') DASH.audit = (await api('GET', '/audit')).events;
  render();
}

function Dashboard() {
  const tab = params.tab || 'conversations';
  const access = ME.access;
  const trialNotice = access.state === 'trial_not_started'
    ? '<div class="notice">Your trial hasn\u2019t started yet — it begins once you add your first piece of business information.</div>'
    : access.state === 'trial'
    ? `<div class="notice">Free trial — ends ${new Date(access.endsAt).toLocaleDateString()}.</div>`
    : access.state === 'expired'
    ? '<div class="notice warn">Your trial has ended. AI replies are paused; you can still reply to customers yourself below.</div>'
    : '';

  let body = '';
  if (tab === 'conversations') body = renderConversations();
  else if (tab === 'knowledge') body = renderKnowledge();
  else if (tab === 'widget') body = renderWidgetTab();
  else if (tab === 'reports') body = renderReports();

  return `
    <div class="row" style="justify-content:space-between">
      <h1 style="margin:0">${esc(ME.organization.name)}</h1>
      <button class="btn ghost" onclick="doLogout()">Log out</button>
    </div>
    ${trialNotice}
    <div class="stat-grid">
      <div class="stat"><div class="num">${ME.counts.needAttention}</div><div class="lab">NEED YOU</div></div>
      <div class="stat"><div class="num">${ME.stats.drafted}</div><div class="lab">AI DRAFTED</div></div>
      <div class="stat"><div class="num">${ME.stats.approved + ME.stats.edited}</div><div class="lab">APPROVED</div></div>
      <div class="stat"><div class="num">${ME.stats.blocked}</div><div class="lab">BLOCKED (safety)</div></div>
    </div>
    <div class="tabs" style="margin-top:20px">
      <button class="${tab==='conversations'?'active':''}" onclick="loadDashboard('conversations')">Conversations</button>
      <button class="${tab==='knowledge'?'active':''}" onclick="loadDashboard('knowledge')">Business info</button>
      <button class="${tab==='widget'?'active':''}" onclick="loadDashboard('widget')">Get the widget</button>
      <button class="${tab==='reports'?'active':''}" onclick="loadDashboard('reports')">Reports</button>
    </div>
    ${body}
  `;
}

function statusLabel(s){return {open:'New',awaiting_review:'Needs your review',answered:'Answered',needs_owner:'Needs you'}[s]||s;}
function renderConversations() {
  if (!DASH.conversations.length) return '<p class="lead">No conversations yet. Add the widget to your site to start getting real ones — or open "Get the widget" to try it yourself right now.</p>';
  return DASH.conversations.map((c) => `
    <div class="conv-row" onclick="openConversation('${c.id}')">
      <div><div style="font-size:13.5px">${esc(c.last_visitor_message || '(no message)').slice(0,80)}</div>
      <div style="font-size:11px;color:var(--fg-dim)">${new Date(c.updated_at).toLocaleString()}</div></div>
      <span class="chip chip-${c.status}">${statusLabel(c.status)}</span>
    </div>`).join('');
}

function renderKnowledge() {
  const items = DASH.docs.map((d) => `
    <div class="doc-item">
      <div class="row" style="justify-content:space-between">
        <h4>${esc(d.title)}</h4>
        <button class="btn danger" style="padding:4px 10px;font-size:12px" onclick="removeDoc('${d.id}')">Delete</button>
      </div>
      <p>${esc(d.body)}</p>
    </div>`).join('');
  return `
    ${items || '<p class="lead">Nothing added yet.</p>'}
    <h2>Add more</h2>
    <form onsubmit="return handleAddDoc(event, false)">
      <div class="field"><label>Title</label><input id="nd_title" required maxlength="200"></div>
      <div class="field"><label>Details</label><textarea id="nd_body" required maxlength="20000"></textarea></div>
      <button class="btn" type="submit">Add</button>
    </form>
  `;
}
async function removeDoc(id) { await api('DELETE', '/knowledge/' + id); await loadDashboard('knowledge'); }

function renderWidgetTab() {
  const snippet = `<script src="${location.origin}/widget.js" data-key="${ME.organization.publicKey}" data-label="Chat with us"><\\/script>`;
  return `
    <p class="lead">Paste this before the closing <code>&lt;/body&gt;</code> tag on your website. It adds a small chat button in the corner.</p>
    <code class="snip">${esc(snippet)}</code>
    <h2>Try it yourself</h2>
    <p class="lead">This page also has the same widget loaded — look for the chat bubble in the corner of this screen, right now.</p>
    ${!ME.aiConfigured ? '<div class="notice warn">The AI is not connected on this server yet, so replies will be held for you to answer manually until that\u2019s set up.</div>' : ''}
  `;
}

function renderReports() {
  if (!DASH.audit.length) return '<p class="lead">Nothing recorded yet.</p>';
  return DASH.audit.map((e) => `
    <div class="msg-row"><div class="msg-role">${new Date(e.created_at).toLocaleString()} · ${esc(e.event)}</div><div class="msg-body" style="font-size:13px;color:var(--fg-dim)">${esc(e.detail)}</div></div>
  `).join('');
}

async function openConversation(id) {
  DASH.conv = await api('GET', '/conversations/' + id);
  go('conversation', { id });
}
function ConversationView() {
  const c = DASH.conv;
  if (!c) return '<p>Loading…</p>';
  const msgs = c.messages.map((m) => {
    if (m.role === 'visitor') return `<div class="msg-row"><div class="msg-role">CUSTOMER</div><div class="msg-body">${esc(m.body)}</div></div>`;
    if (m.state === 'draft') return `
      <div class="draft-box">
        <div class="msg-role">AI DRAFT — awaiting your review (${esc(m.verification_status)})</div>
        <div class="msg-body">${esc(m.body)}</div>
        <p style="font-size:12px;color:var(--fg-dim);margin:6px 0">${esc(m.verification_notes||'')}</p>
        ${(m.sources||[]).length ? '<p style="font-size:11px;color:var(--fg-dim)">Based on: ' + m.sources.map(s=>esc(s.title)).join(', ') + '</p>' : ''}
        <div class="row" style="margin-top:8px">
          <button class="btn" onclick="approveDraft('${m.id}')">Approve & send</button>
          <button class="btn ghost" onclick="editDraft('${m.id}')">Edit & send</button>
          <button class="btn danger" onclick="rejectDraft('${m.id}')">Reject</button>
        </div>
      </div>`;
    if (m.state === 'blocked') return `<div class="notice warn">AI reply blocked: ${esc(m.verification_notes)}</div>`;
    if (m.state === 'sent') return `<div class="msg-row"><div class="msg-role">SUPPORT ${m.verification_status==='MANUAL'?'(you)':''}</div><div class="msg-body">${esc(m.body)}</div></div>`;
    return '';
  }).join('');
  return `
    <p><a onclick="go('dashboard',{tab:'conversations'})">&larr; Conversations</a></p>
    <h1>Conversation</h1>
    ${msgs}
    <h2>Reply yourself</h2>
    <form onsubmit="return handleManualReply(event,'${c.conversation.id}')">
      <textarea id="manual_reply" placeholder="Write a reply to send now"></textarea>
      <button class="btn" style="margin-top:8px" type="submit">Send</button>
    </form>
  `;
}
async function approveDraft(id) { await api('POST', `/conversations/${DASH.conv.conversation.id}/messages/${id}/approve`, {}); await openConversation(DASH.conv.conversation.id); }
async function rejectDraft(id) { await api('POST', `/conversations/${DASH.conv.conversation.id}/messages/${id}/reject`, {}); await openConversation(DASH.conv.conversation.id); }
async function editDraft(id) {
  const edited = prompt('Edit the reply before sending:');
  if (edited === null) return;
  await api('POST', `/conversations/${DASH.conv.conversation.id}/messages/${id}/approve`, { editedBody: edited });
  await openConversation(DASH.conv.conversation.id);
}
async function handleManualReply(e, convId) {
  e.preventDefault();
  const body = document.getElementById('manual_reply').value.trim();
  if (!body) return false;
  await api('POST', `/conversations/${convId}/reply`, { body });
  await openConversation(convId);
  return false;
}
function doLogout(){ logout(); }

async function render() {
  const app = document.getElementById('app');
  let content = '';
  try {
    if (view === 'landing') content = Landing();
    else if (view === 'browse') content = Browse();
    else if (view === 'profile') content = Profile();
    else if (view === 'signup') content = Signup();
    else if (view === 'login') content = Login();
    else if (view === 'onboarding') content = await Onboarding();
    else if (view === 'dashboard') { if (!ME) return loadDashboard(); content = Dashboard(); }
    else if (view === 'conversation') content = ConversationView();
  } catch (ex) {
    if (ex.status === 401) { logout(); return; }
    content = `<div class="error">${esc(ex.message)}</div>`;
  }
  app.innerHTML = `
    <header class="bar">
      <div class="wordmark" onclick="go(${TOKEN ? "'dashboard'" : "'landing'"})">AI Workforce</div>
      <nav class="top">
        ${TOKEN ? '' : `<a onclick="go('browse')">Browse</a><a onclick="go('login')">Log in</a>`}
      </nav>
    </header>
    <main>${content}</main>
  `;
}
render();
</script>
<script src="/widget.js" data-key="demo" data-label="Try the chat"></script>
</body>
